    revised: ""

  - name: car_weight
    status: active
    source: design/gdd/car-definition-data.md
    referenced_by:
      - design/gdd/car-definition-data.md
      - design/gdd/vehicle-physics.md
      - design/gdd/fuel-system.md
    value: 505
    unit: kg
    notes: "Fixed for all 16 cars. Not a differentiating stat -- exists for physics calculations. Fuel System confirms weight is constant regardless of fuel level."
    added: 2026-07-22
    revised: ""

  - name: fuel_tank_capacity
    status: active
    source: design/gdd/fuel-system.md
    referenced_by:
      - design/gdd/fuel-system.md
      - design/gdd/pit-stop.md
    value: 8.0
    unit: liters
    notes: "Fixed across all tiers and difficulties. Pit Stop fills at 0.8 L/s; player may exit after the 2s tire swap with partial fuel, while AI waits until this full 8.0L value is restored in MVP."
    added: 2026-07-22
    revised: ""

  - name: global_max_velocity
    status: active
    source: design/gdd/vfx.md
    referenced_by:
      - design/gdd/vfx.md
      - design/gdd/car-definition-data.md
    value: "max(all car top speeds)"
    unit: km/h
    # was: note stated that every VFX intensity used only global_max_velocity before 2026-07-24
    notes: "Computed at runtime as the maximum top speed across all 16 cars on the current grid. Tier 1 max = ~310 km/h. Used as the denominator in blur/vignette mappings and as the upper bound in the onset-adjusted streak_intensity formula."
    added: 2026-07-22
    revised: "2026-07-24"

  - name: fixed_timestep
    status: active
    source: design/gdd/simulation-architecture.md
    referenced_by:
      - design/gdd/simulation-architecture.md
      - design/gdd/vehicle-physics.md
    value: 0.016667
    unit: seconds (1/60 Hz)
    notes: "FIXED_DT = 1/60 seconds ≈ 16.667ms. Simulation runs at 60 Hz via Physics.Simulate(FIXED_DT) decoupled from render frame rate."
    added: 2026-07-22
    revised: ""
