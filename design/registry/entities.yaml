# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: fuel_consumption_rate
    status: active
    source: design/gdd/fuel-system.md
    referenced_by:
      - design/gdd/fuel-system.md
      - design/gdd/car-definition-data.md
    variables:
      - base_rate
      - throttle_input
      - efficiency_modifier
      - difficulty_modifier
    output_range: [0.0, null]
    expression: "base_rate × throttle_input × (1 - efficiency_stat × 0.025) × difficulty_modifier"
    notes: "Fuel System GDD defines the full expression. Car Definition Data provides efficiency stat (0-20 scale) and defines efficiency_modifier as base × (1 - stat × 0.03). The two expressions differ in the constant (0.025 vs 0.03) -- this is a potential inconsistency flagged for review."
    added: 2026-07-22
    revised: ""

  - name: tire_wear_rate
    status: active
    source: design/gdd/tire-system.md
    referenced_by:
      - design/gdd/tire-system.md
      - design/gdd/car-definition-data.md
    variables:
      - base_rate
      - distance_factor
      - aggression
      - surface_penalty
      - efficiency_modifier
      - difficulty_modifier
    output_range: [0.0, null]
    expression: "base_rate × distance_factor × aggression × surface_penalty × efficiency_modifier × difficulty_modifier"
    notes: "Tire System GDD defines the full expression. Car Definition Data provides efficiency stat that feeds into efficiency_modifier."
    added: 2026-07-22
    revised: ""

  - name: grip_stacking
    status: active
    source: design/gdd/vehicle-physics.md
    referenced_by:
      - design/gdd/vehicle-physics.md
      - design/gdd/tire-system.md
    variables:
      - base_grip
      - tire_multiplier
      - surface_modifier
      - stability_modifier
    output_range: [0.20, 1.0]
    expression: "base_grip × tire_multiplier × surface_modifier × stability_modifier"
    notes: "Tire System outputs grip_multiplier = 1.0 - (wear_percent × (1.0 - grip_floor)) where grip_floor = 0.20. Vehicle Physics consumes this multiplier in grip_stacking formula."
    added: 2026-07-22
    revised: ""

  - name: vfx_intensity
    status: active
    source: design/gdd/vfx.md
    referenced_by:
      - design/gdd/vfx.md
      - design/gdd/car-definition-data.md
    variables:
      - speed
      - global_max_velocity
    output_range: [0.0, 1.0]
    expression: "clamp(speed / global_max_velocity, 0, 1)"
    notes: "Used for streak_intensity (0-1), blur_amount (0-0.5), and vignette_intensity (0-0.4). global_max_velocity is read from Car Definition Data at runtime as max(all car top speeds)."
    added: 2026-07-22
    revised: ""

  - name: qualifying_time
    status: active
    source: design/gdd/qualifying.md
    referenced_by:
      - design/gdd/qualifying.md
      - design/gdd/ai-rival.md
    variables:
      - base_time
      - tier_modifier
      - difficulty_modifier
      - variance
    output_range: [null, null]
    expression: "ai_time = base_time × tier_modifier × difficulty_modifier × variance"
    notes: "Tier modifier: T1=1.00, T2=1.015, T3=1.035, T4=1.055. Difficulty modifier: Easy=1.01, Normal=1.00, Hard=0.99. Variance: ±0.8%. Output feeds into Grid & Start for grid_position."
    added: 2026-07-22
    revised: ""

  - name: position_ranking
    status: active
    source: design/gdd/race-session-manager.md
    referenced_by:
      - design/gdd/race-session-manager.md
      - design/gdd/grid-start.md
    variables:
      - lapCount
      - splinePosition
      - totalDistance
    output_range: [1, 16]
    expression: "rank(cars) by: 1. lapCount DESC, 2. splinePosition DESC (within same lap), tiebreaker by time reaching position"
    notes: "Race Session Manager uses this for live race position. Grid & Start uses a different ranking (rank(qualifying_times, ascending)) for grid position, but both are position-ranking formulas operating on 16 cars."
    added: 2026-07-22
    revised: ""


# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

constants:
  - name: race_laps
    status: active
    source: design/gdd/race-session-manager.md
    referenced_by:
      - design/gdd/race-session-manager.md
      - design/gdd/hud.md
      - design/gdd/game-concept.md
    value: 5
    unit: laps
    added: 2026-07-22
    revised: ""

  - name: grid_size
    status: active
    source: design/gdd/race-session-manager.md
    referenced_by:
      - design/gdd/race-session-manager.md
      - design/gdd/grid-start.md
      - design/gdd/ai-rival.md
      - design/gdd/game-concept.md
    value: 16
    unit: cars
    added: 2026-07-22
    revised: ""

  - name: pit_stop_time
    status: active
    source: design/gdd/pit-stop.md
    referenced_by:
      - design/gdd/pit-stop.md
      - design/gdd/race-session-manager.md
      - design/gdd/fuel-system.md
      - design/gdd/tire-system.md
    value: "8-10"
    unit: seconds
    notes: "Tire swap (~2s) and fuel fill (~8-10s) run in parallel. Total duration = max(tire_swap_time, fuel_fill_time) = 8-10s."
    added: 2026-07-22
    revised: ""

  - name: car_weight
    status: active
    source: design/gdd/car-definition-data.md
    referenced_by:
      - design/gdd/car-definition-data.md
      - design/gdd/vehicle-physics.md
      - design/gdd/fuel-system.md
    value: 505
    unit: kg
    notes: "Fixed for all 16 cars. Not a differentiating stat -- exists for physics calculations. Fuel System confirms weight is constant regardless of fuel level."
    added: 2026-07-22
    revised: ""

  - name: fuel_tank_capacity
    status: active
    source: design/gdd/fuel-system.md
    referenced_by:
      - design/gdd/fuel-system.md
      - design/gdd/pit-stop.md
    value: 8.0
    unit: liters
    notes: "Fixed across all tiers and difficulties. Pit Stop uses this for fuel_fill_rate = tank_capacity / max_fill_time = 0.8 L/s."
    added: 2026-07-22
    revised: ""

  - name: global_max_velocity
    status: active
    source: design/gdd/vfx.md
    referenced_by:
      - design/gdd/vfx.md
      - design/gdd/car-definition-data.md
    value: "max(all car top speeds)"
    unit: km/h
    notes: "Computed at runtime as the maximum top speed across all 16 cars on the current grid. Tier 1 max = ~310 km/h. Used as denominator in VFX intensity formulas (streak_intensity, blur_amount, vignette_intensity)."
    added: 2026-07-22
    revised: ""

  - name: fixed_timestep
    status: active
    source: design/gdd/simulation-architecture.md
    referenced_by:
      - design/gdd/simulation-architecture.md
      - design/gdd/vehicle-physics.md
    value: 0.016667
    unit: seconds (1/60 Hz)
    notes: "FIXED_DT = 1/60 seconds ≈ 16.667ms. Simulation runs at 60 Hz via Physics.Simulate(FIXED_DT) decoupled from render frame rate."
    added: 2026-07-22
    revised: ""
