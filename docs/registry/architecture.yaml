# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: vehicle_driver
    status: active
    pattern: direct_call
    producer: vehicle-physics-system
    consumers:
      - simulation-architecture
    adr: docs/architecture/adr-0002-vehicle-physics-implementation-pattern.md
    signature: "IVehicleDriver.ApplyForces(VehicleHandle, in VehicleSimState); ReadCarState(VehicleHandle); ReadSimStateForNextTick(VehicleHandle)"
    referenced_by:
      - docs/architecture/adr-0002-vehicle-physics-implementation-pattern.md
    added: 2026-07-27
    revised: ""

  - contract: collision_event_forwarding
    status: active
    pattern: direct_call
    producer: CarCollisionMonitor (MonoBehaviour per car)
    consumers:
      - vehicle-physics-system
    adr: docs/architecture/adr-0002-vehicle-physics-implementation-pattern.md
    signature: "OnCollisionEnter/Stay/Exit → forwards contact data to VehiclePhysicsSystem"
    referenced_by:
      - docs/architecture/adr-0002-vehicle-physics-implementation-pattern.md
    added: 2026-07-27
    revised: ""

  - contract: content_pipeline_events
    status: active
    pattern: event_delegate
    producer: ContentPipelineSystem
    consumers:
      - simulation-architecture
      - ui-menu
    adr: docs/architecture/adr-0003-content-pipeline-and-addressables.md
    signature: "event RaceLoadReady(RaceMode, GridAssignment); event ContentLoadError(string, ContentErrorType); event RaceReconfigureStart(); event ContentUnloadComplete(); event LoadingProgress(float)"
    referenced_by:
      - docs/architecture/adr-0003-content-pipeline-and-addressables.md
    added: 2026-07-27
    revised: ""

  - contract: settings_input_preview_evaluator
    status: active
    pattern: direct_call
    producer: SettingsInputPreviewEvaluator (UI-only)
    consumers:
      - input-system
    adr: docs/architecture/adr-0004-settings-persistence-and-control-profiles.md
    signature: "EvaluatePreview(float rawValue, ControlScheme scheme) → float — same stick dead-zone + EMA formulas as InputSystem per-tick routine. Does NOT read/write SimulationInput or advance simulation."
    referenced_by:
      - docs/architecture/adr-0004-settings-persistence-and-control-profiles.md
    added: 2026-07-27
    revised: ""


