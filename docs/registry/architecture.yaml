# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: arcade_force_application
    status: active
    api: ForceMode.Acceleration (with Rigidbody.AddForce)
    not: ForceMode.Force (respects mass, more sim-like)
    adr: docs/architecture/adr-0002-vehicle-physics-implementation-pattern.md
    reason: "Arcade handling model requires mass-independent force response."
    referenced_by:
      - docs/architecture/adr-0002-vehicle-physics-implementation-pattern.md
    added: 2026-07-27
    revised: ""

  - purpose: async_content_loading
    status: active
    api: Addressables 3.1.0 (LoadAssetAsync, ReleaseInstance, Release)
    not: Resources.Load
    adr: docs/architecture/adr-0003-content-pipeline-and-addressables.md
    reason: "Per-race loading/unloading requires async asset management."
    referenced_by:
      - docs/architecture/adr-0003-content-pipeline-and-addressables.md
    added: 2026-07-27
    revised: ""

  - purpose: settings_persistence
    status: active
    api: PlayerPrefs single JSON blob + backup key
    not: Individual PlayerPrefs keys, file IO
    adr: docs/architecture/adr-0004-settings-persistence-and-control-profiles.md
    reason: "Backup-first atomic writes require a single blob."
    referenced_by:
      - docs/architecture/adr-0004-settings-persistence-and-control-profiles.md
    added: 2026-07-27
    revised: ""

  - purpose: ghost_recording_format
    status: active
    api: 80-byte binary header + continuous input stream (12 B/tick) + edge event stream (5 B/event)
    not: JSON, XML, text-based formats
    adr: docs/architecture/adr-0008-ghost-recording-data-format-and-mvp-buffer.md
    reason: "~264 KB uncompressed per full race. CRC integrity per 256-tick block."
    referenced_by:
      - docs/architecture/adr-0008-ghost-recording-data-format-and-mvp-buffer.md
    added: 2026-07-27
    revised: ""

  - purpose: track_spline_storage
    status: active
    api: JSON + JsonUtility + Catmull-Rom chordal interpolation
    not: AnimationCurve, ScriptableObject-only
    adr: docs/architecture/adr-0007-track-spline-format.md
    reason: "GPX/GeoJSON → Python → JSON pipeline. Catmull-Rom for smooth tangents."
    referenced_by:
      - docs/architecture/adr-0007-track-spline-format.md
    added: 2026-07-27
    revised: ""

  - purpose: ai_deterministic_behavior
    status: active
    api: AiRivalSystem.Tick(PublishedSimulationSnapshot) → AIInput[16]. PCG32 per-car.
    not: MonoBehaviour-driven AI (no central authority)
    adr: docs/architecture/adr-0009-ai-rival-deterministic-architecture.md
    reason: "Pure C# snapshot observer ensures deterministic AI."
    referenced_by:
      - docs/architecture/adr-0009-ai-rival-deterministic-architecture.md
    added: 2026-07-27
    revised: ""

  - purpose: camera_vfx_presentation
    status: active
    api: Custom C# camera controller + ParticleSystem + URP Volume MotionBlur
    not: Cinemachine, VFX Graph
    adr: docs/architecture/adr-0010-camera-vfx-rendering-budget-and-interpolation.md
    reason: "No external dependency for MVP camera or VFX."
    referenced_by:
      - docs/architecture/adr-0010-camera-vfx-rendering-budget-and-interpolation.md
    added: 2026-07-28
    revised: ""


# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: physics_callback_mutates_gameplay_state
    status: active
    description: "OnCollisionEnter/Stay/Exit callbacks must NOT directly mutate gameplay state (fuel, tire, CarState, AI state). Instead, CarCollisionMonitor forwards raw contact data to VehiclePhysicsSystem, which evaluates collision rules at the designated tick step."
    why: "Physics callbacks run inside Physics.Simulate() — mutating state there breaks the tick pipeline ordering and creates race conditions with domain systems that read CarState at Step 9."
    adr: docs/architecture/adr-0002-vehicle-physics-implementation-pattern.md
    added: 2026-07-27


