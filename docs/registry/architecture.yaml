# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: superseded_by: ADR-NNNN instead.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="status: superseded"

version: 1
last_updated: ""

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: CarState[16]
    status: active
    owner_system: vehicle-physics-system
    adr: docs/architecture/adr-0002-vehicle-physics-implementation-pattern.md
    interface: "CarState per car per tick (readonly struct): Position, Rotation, LinearVelocity, SpeedKmh, Rpm, Gear, State, SlipState, Surface, PitPhase, WallContact, SlideState, ForwardDot"
    write_access: vehicle-physics-system-only
    referenced_by:
      - docs/architecture/adr-0002-vehicle-physics-implementation-pattern.md
    added: 2026-07-27
    revised: ""

  - state: DifficultyProfile data
    status: active
    owner_system: settings-system
    adr: docs/architecture/adr-0004-settings-persistence-and-control-profiles.md
    interface: "5 ScriptableObject assets at Assets/Settings/Difficulty/. Simulation snapshots resolved struct via Settings.GetProfile(id) at race init."
    write_access: settings-system-only
    referenced_by:
      - docs/architecture/adr-0004-settings-persistence-and-control-profiles.md
    added: 2026-07-27
    revised: ""

  - state: FuelState[16]
    status: active
    owner_system: fuel-system
    adr: docs/architecture/adr-0006-fuel-tire-state-ownership-and-tick-timing.md
    interface: "FuelState per tick: currentFuel, fuelFraction, state (FuelStateEnum), topSpeedModifier, lastLapFuelUse, lowFuelActive"
    write_access: fuel-system-only
    referenced_by:
      - docs/architecture/adr-0006-fuel-tire-state-ownership-and-tick-timing.md
    added: 2026-07-27
    revised: ""

  - state: TireState[16]
    status: active
    owner_system: tire-system
    adr: docs/architecture/adr-0006-fuel-tire-state-ownership-and-tick-timing.md
    interface: "TireState per tick: wearFraction, runtimeGripMultiplier, compoundId (byte), lastLapTireWear"
    write_access: tire-system-only
    referenced_by:
      - docs/architecture/adr-0006-fuel-tire-state-ownership-and-tick-timing.md
    added: 2026-07-27
    revised: ""

  - state: PitState[16]
    status: active
    owner_system: pit-stop-system
    adr: docs/architecture/adr-0011-pit-stop-architecture.md
    interface: "PitState per car per tick: carId, assignedBoxId, phase (PitServicePhase: NotPitting/PitTransit/InPitBox/PitExiting), serviceTimer, tireSwapComplete, fuelLoaded, playerCanExit, pitThisLap"
    write_access: pit-stop-system-only
    referenced_by:
      - docs/architecture/adr-0011-pit-stop-architecture.md
    added: 2026-07-28
    revised: ""

# ─── INTERFACE CONTRACTS ─────────────────────────────────────────────────

  - purpose: audio_system
    status: active
    api: AudioSystem.Tick(CarAudioState[], SimulationState, RaceMode, PitPhase, CameraMode, AudioSettings) → audio output
    not: FMOD, Wwise, pre-recorded engine samples per car (procedural-first)
    adr: docs/architecture/adr-0012-audio-system-architecture.md
    reason: "Unity Audio Mixer covers all MVP needs. Procedural-first engine (2-oscillator) with IEngineSoundProvider seam for future sample replacement. DynamicUpdate per ADR-0010 pattern."
    referenced_by:
      - docs/architecture/adr-0012-audio-system-architecture.md
    added: 2026-07-28
    revised: ""

  - purpose: i_engine_sound_provider
    status: active
    api: IEngineSoundProvider.Update(in CarAudioState, AudioSource)
    not: Engine sound hardcoded in AudioSystem
    adr: docs/architecture/adr-0012-audio-system-architecture.md
    reason: "Seam for future engine sound replacement (procedural → Asset Store samples → hybrid) without changing AudioSystem."
    referenced_by:
      - docs/architecture/adr-0012-audio-system-architecture.md
    added: 2026-07-28
    revised: ""

