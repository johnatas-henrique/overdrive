# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: vehicle_driver
    status: active
    pattern: direct_call
    producer: vehicle-physics-system
    consumers:
      - simulation-architecture
    adr: docs/architecture/adr-0002-vehicle-physics-implementation-pattern.md
    signature: "IVehicleDriver.ApplyForces(VehicleHandle, in VehicleSimState); ReadCarState(VehicleHandle); ReadSimStateForNextTick(VehicleHandle)"
    referenced_by:
      - docs/architecture/adr-0002-vehicle-physics-implementation-pattern.md
    added: 2026-07-27
    revised: ""

  - contract: collision_event_forwarding
    status: active
    pattern: direct_call
    producer: CarCollisionMonitor (MonoBehaviour per car)
    consumers:
      - vehicle-physics-system
    adr: docs/architecture/adr-0002-vehicle-physics-implementation-pattern.md
    signature: "OnCollisionEnter/Stay/Exit → forwards contact data to VehiclePhysicsSystem"
    referenced_by:
      - docs/architecture/adr-0002-vehicle-physics-implementation-pattern.md
    added: 2026-07-27
    revised: ""

  - contract: content_pipeline_events
    status: active
    pattern: event_delegate
    producer: ContentPipelineSystem
    consumers:
      - simulation-architecture
      - ui-menu
    adr: docs/architecture/adr-0003-content-pipeline-and-addressables.md
    signature: "event RaceLoadReady(RaceMode, GridAssignment); event ContentLoadError(string, ContentErrorType); event RaceReconfigureStart(); event ContentUnloadComplete(); IRaceLoadProgress (float Progress { get; } + event Action<float> ProgressChanged)"
    referenced_by:
      - docs/architecture/adr-0003-content-pipeline-and-addressables.md
    added: 2026-07-27
    revised: "2026-08-14"

  - contract: content_race_runtime_handoff
    status: active
    pattern: interface
    producer: ContentPipelineSystem
    consumers:
      - vehicle-physics
      - track-system
      - grid-and-start
    adr: docs/architecture/adr-0003-content-pipeline-and-addressables.md
    signature: "IRaceContentRuntime { TrackInstance (loaded+instantiated by Content); CarReferences (loaded prefab assets, NOT instantiated — Vehicle Physics/Grid & Start spawn car GameObjects); Grid (locked GridAssignment); IsValid (SM-owned HandoffValid flag projected onto the runtime: valid from RaceLoadReady emission until the EARLIER of ContentUnloadComplete or a next-race transition into CP_LoadingTrack; consumers must not retain past either invalidation) } — supersedes the ambiguous reading of ADR-0003:159 'instantiated before RaceLoadReady': Content instantiates the track instance + loads prefab assets; car GameObject spawning is Vehicle Physics/Grid & Start responsibility."
    referenced_by:
      - docs/architecture/adr-0003-content-pipeline-and-addressables.md
    added: 2026-08-12
    revised: ""

  - contract: content_readiness_forwarder
    status: active
    pattern: interface
    producer: ContentPipelineSystem
    consumers:
      - simulation-state-machine
    adr: docs/architecture/adr-0003-content-pipeline-and-addressables.md
    signature: "IReadinessForwarder { Forward(RaceMode, GridAssignment) } - the SM injectable publication port (Story 002): called EXACTLY ONCE per accepted readiness and ONLY from CP_Ready; the implementation invokes SimulationStateMachine.OnRaceLoadReady (void - no acknowledge); a throw is a wiring defect (fail-fast, SM does not catch)."
    referenced_by:
      - production/epics/content-pipeline/story-002-cp-state-machine-kernel-handshake.md
    added: 2026-08-14
    revised: ""

  - contract: settings_input_preview_evaluator
    status: active
    pattern: direct_call
    producer: SettingsInputPreviewEvaluator (UI-only)
    consumers:
      - input-system
    adr: docs/architecture/adr-0004-settings-persistence-and-control-profiles.md
    signature: "EvaluatePreview(float rawValue, ControlScheme scheme) → float — same stick dead-zone + EMA formulas as InputSystem per-tick routine. Does NOT read/write SimulationInput or advance simulation."
    referenced_by:
      - docs/architecture/adr-0004-settings-persistence-and-control-profiles.md
    added: 2026-07-27
    revised: ""

  - contract: grid_assignment
    status: active
    pattern: immutable_data
    producer: race-session-manager
    consumers:
      - grid-start
      - content-pipeline
    adr: docs/architecture/adr-0013-qualifying-session-format.md
    signature: "GridAssignment { carId → gridSlot[1..16] } — immutable after qualifying completion. Produced by RSM, consumed by Grid & Start and Content Pipeline."
    referenced_by:
      - docs/architecture/adr-0013-qualifying-session-format.md
    added: 2026-07-31
    revised: ""

  - contract: hud_data_pipeline
    status: active
    pattern: snapshot_only
    producer: simulation-architecture
    consumers:
